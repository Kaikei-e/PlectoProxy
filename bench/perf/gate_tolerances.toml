# Gate bands — the machine-checked expectation for every invariant `run-perf.sh gate` measures.
# Tracked in-repo ON PURPOSE: a deliberate performance change must widen/move its band in the same
# PR, so the perf expectation is code-reviewed like any other contract change.
#
# Bands are host-relative (loopback, no governor pinning): these initial values are calibrated
# from the 2026-07-11 report snapshots on the reference host. On a new host, run the gate 2-3
# times, read gate.csv's value/ci_half/n columns, and re-centre lo/hi around them.
#
# `ci_half` semantics (since ADR 000122): the two-sided 95% Student-t half-width of the mean of the
# n per-round PAIRED deltas, `t_{0.975,n-1} * s / sqrt(n)`, with `n` reported in the last column.
# A verdict is `pass` only if the whole interval lies inside the band. Historical half-widths quoted
# in the comments below (e.g. "1.4386 ± 0.1045") are the OLD sample half-range `(max - min) / 2`
# over 2-3 rounds — roughly ±1 SE, NOT a 95% interval; re-judging the archived 2026-10-21..24 raw
# rounds with the t interval (n = 2..3) turns all five INCONCLUSIVE on ratelimit_tax_us against the
# then-current 0.9..2.4 band (three of five against today's 0.5..2.4). That is why the gate now runs
# ROUNDS = 8 short paired rounds (t/sqrt(n) = 0.84 vs 2.48 at n = 3). Band edges were set with the old
# half-range rule (centre ± >= 3x half-range) and are kept as-is until n = 8 runs give calibrated
# spreads — except ratelimit_tax_us's lower edge, moved on 2026-10-25 (see its entry). Prefer DELTAS (µs/req, ms) over absolute
# throughput — they survive host drift far better; see bench/methodology.md § Measurement tiers.

# noop-pooled − baseline, closed-loop µs/req (interleaved mean): the WASM dispatch floor.
# 2026-07-11 report snapshots put the CROSS-PHASE delta at 3.74 / 3.9 µs; the gate's same-session
# interleave measured 2.45 ± 0.16 µs on 2026-07-11 (different host state, and baseline measured
# in-session rather than borrowed from ceiling.csv). Band spans both until 2-3 more gate runs
# tighten it — PROVISIONAL.
# 2026-09-15: four same-session gate runs landed at 4.68 ± 0.09, 2.76 ± 0.12 and 4.64 ± 0.09 µs on
# 0.11.5 (wasmtime 48.0.2) and 4.67 ± 0.12 µs on the previous release (0.11.4, wasmtime 48.0.1),
# interleaved B/A/B. The upper mode reproduces on unchanged code, so it is host state (powersave
# governor, loaded neighbours) rather than the runtime bump; hi moves 4.6 → 5.0. Still PROVISIONAL.
# 2026-09-29: inline header hooks (ADR 000119) avoid blocking-pool handoffs for eligible filters.
# Two same-session T1 runs landed at 1.4386 ± 0.1045 and 1.4987 ± 0.1843 µs
# (performance/data/runs/gate-inline-hooks-{1,2}). Recalibrated using centre ± ≥3x max half-range
# rounded outward: lo moves 2.0 → 0.9, hi 5.0 → 2.1. A regression back to the blocking-pool path
# (~4.1 µs floor) lands clearly outside. PROVISIONAL pending more runs.
[dispatch_floor_us]
lo = 0.9
hi = 2.1

# trusted − noop-pooled, closed-loop µs/req: the apikey filter's own per-request work.
# 2026-07-06 interleaved A/B: 0.6 ± 0.2 µs; 2026-07-11 single-window: 0.86 µs (uncapped glibc, N=0).
# 2026-09-28: default malloc arena cap moved 4 → 32 (ADR 000118, selected via T3 throughput/RSS trade-off).
# Under the current runner on the reference host, default32 T1 runs landed at 1.4053 ± 0.0716 and
# 1.4210 ± 0.0451 µs (old band 0.3..1.2 FAIL); a paired explicit cap 0 control landed at 1.1052 ± 0.1744 µs
# (old band INCONCLUSIVE, exit 2). These observed values reflect the specific benchmark setup and host conditions;
# single cap 0 and current host variations do not prove causal attribution solely to the arena cap.
# Operational recalibration (not a statistical confidence guarantee) sets hi 1.2 → 1.7 based on default32:
# max observed center 1.421 + 3x max half-range 0.0716 ≈ 1.636, rounded up to 1.7. lo (0.3) and all other
# bands remain unchanged. An independent explicit32 T1 holdout run
# (performance/data/runs/gate-explicit32-validation-20260928) completed with gate exit 0 (10 pass,
# 0 fail, 0 inconclusive), with apikey_cost_us landing at 1.2994 ± 0.2035 µs inside the 0.3..1.7 band.
[apikey_cost_us]
lo = 0.3
hi = 1.7

# Fixed-rate (2000 rps) p50 deltas, ms — the honest tail floor invariants.
# noop-pooled − baseline: +0.11 ms across the last two pre-inline-hook snapshots.
# 2026-10-21 (wasmtime 50.0.0): under inline header hooks (ADR 000119), when P-cores remain at turbo
# clock during the 2000 rps window (baseline p50 ~0.062 ms vs ~0.282 ms downclocked), noop-pooled −
# baseline lands at +0.0131 ms (13.1 µs, matching the ~21% relative delta of downclocked runs).
# Lower lo 0.04 → 0.00 to span both turbo and powersave host states while keeping hi = 0.20.
[pooled_tail_p50_ms]
lo = 0.00
hi = 0.20

# trusted − noop-pooled: +0.055 ms on 2026-07-11.
[apikey_tail_p50_ms]
lo = -0.02
hi = 0.15

# resp-ctx − noop-pooled (ADR 000073 as-forwarded snapshot read on on-response).
# PROVISIONAL: no prior 2000 rps measurement exists (the v03 tail ran at 67k rps) — calibrate
# after the first 2-3 gate runs, then tighten.
[respctx_tail_p50_ms]
lo = -0.05
hi = 0.25

# ratelimit − baseline, closed-loop µs/req (k6, generous bucket, 1000 keys).
# 2026-07-11: 3.24 µs.
# 2026-09-10: 4.60 ± 0.05 µs. The floor moved by the ADR 000115 hardening — durable quota usage
# is now accounted per operation and the 1,024-byte key limit is checked on the KV / counter /
# rate-limit path. Measured against the previous release on the same host in the same session
# (4.03 ± 0.05 µs), so the +0.57 µs is the fix's cost rather than host drift; hi moves 4.2 → 5.0.
# 2026-09-29: inline header hooks (ADR 000119) run eligible rate-limit filters inline on the worker
# under the in-memory state backend. Two same-session T1 runs landed at 1.7348 ± 0.0405 and
# 1.7771 ± 0.0232 µs (performance/data/runs/gate-inline-hooks-{1,2}). Band set using centre
# ± ≥3x max half-range rounded outward, widened further (lo 1.2, hi 2.4) because k6 runs have
# historically shown up to ±0.64 µs half-range. A regression back to the blocking-pool path
# (~4.6 µs tax) lands clearly outside. PROVISIONAL pending more runs.
# 2026-10-21 (wasmtime 50.0.0): Criterion on_request/trusted_pooled improved -9.4% (2.271 → 2.091 µs)
# and T1 gate landed at 1.1752 ± 0.0282 µs, straddling lo = 1.2 from below. Lower lo 1.2 → 0.9
# (matching dispatch_floor_us lo = 0.9) while keeping hi = 2.4.
# 2026-10-24 (ADR 000122): this closed-loop k6 delta is NOT additive with dispatch_floor_us (oha):
# the k6 /baseline arm runs near the generator's own ceiling (~150k rps vs oha's ~213k in the 10-24
# confirmation run), which plausibly lets generator slack absorb part of the filter's work — the tax
# reads BELOW the same run's floor in 7 of 9 gate runs (1.20 vs 1.29 there). Track it for regressions
# only; the CPU row below is a candidate generator-independent read (additivity not yet verified).
# 2026-10-25 (first 8-round paired runs, 95 % t interval): 1.0768 ± 0.1538, 1.0183 ± 0.2610, 1.0964 ± 0.3878
# (pooled n = 24: 1.0638 ± 0.1378). Two of three single runs were INCONCLUSIVE only because the interval's
# lower edge (0.757 / 0.709) dipped under lo = 0.9 — i.e. on the FAST side. lo moves 0.9 → 0.5 (below the
# lowest observed lower edge 0.709, rounded outward). This only admits a cheaper tax; the slow-side guard
# hi = 2.4 (a blocking-pool regression reads ~4.6 µs) is unchanged, and "the filter silently stopped
# limiting" is caught by enforce_allowed_ratio, not by this lower edge. Confirmed by an independent
# holdout gate run (`20261025T061734Z`, n = 8, no pooling): PASS on all 10 invariants (`ratelimit_tax_us`
# 1.4863 ± 0.5407 µs, `dispatch_floor_us` 1.1652 ± 0.1237 µs, `apikey_cost_us` 1.0562 ± 0.0918 µs).
[ratelimit_tax_us]
lo = 0.5
hi = 2.4

# CPU-µs/req (ADR 000122): /ratelimit − /baseline proxy CPU time per completed request at a FIXED
# 20k/s (k6 constant-arrival-rate, well below saturation; /proc/<pid>/task/*/schedstat around each
# arm). Reported as `info` (with `baseline_cpu_us_per_req`, whose absolute value includes the
# in-process mock upstream) until calibrated. To promote it to a judged invariant, add
#   [ratelimit_cpu_us_per_req]
#   lo = ...
#   hi = ...
# here after >= 3 gate runs on the reference host; gate_verdict.py judges any row that has a band.
# 2026-10-25 (first run, 20261025T052103Z, n = 4): +14.29 ± 1.54 µs over a 32.66 µs/req baseline;
# 3-run pooled (n = 12): +15.27 ± 0.97 µs over 32.35 ± 0.39 µs; holdout (`20261025T061734Z`, n = 4,
# with 11 s pre-window settle so zero threads exit mid-window): +18.34 ± 0.80 µs over 34.52 ± 0.68 µs.

# Enforcement convergence: allowed_rps / ((capacity + max(0, window_s - 1) * refill_per_s) / window_s).
# In plecto-host (`apply_bucket`), token refills happen in discrete integer multiples of
# `refill_interval_ms = 1000` (`intervals = elapsed / 1000`). Over `window_s` seconds, after the
# initial burst of `capacity` (2,000) is drained at t=0, the bucket experiences `window_s - 1`
# discrete 1 s refill ticks (9 ticks in 10 s -> 2,000 + 9 * 1,000 = 11,000 tokens = 1,100 req/s)
# because the tick at t = window_s coincides with the end of the test window. Before ADR 000122 the
# expectation used the continuous approximation refill + capacity / window_s (1,200 req/s), which is
# why every historical gate.csv reads 0.9166 for a correctly behaving bucket; the band itself was
# already 0.90..1.10 and is unchanged. The params here MUST match phase_gate's launch env and D_ENF.
[enforce_allowed_ratio]
refill_per_s = 1000
capacity = 2000
window_s = 10
lo = 0.90
hi = 1.10

# Round-robin exactness: max(count) − min(count) over the three instances, in requests.
[rr_spread_req]
lo = 0
hi = 0

# Slowest event -> steady-state transition on the compressed ejection timeline, in 1 s buckets.
# Historical timelines settle in 1-2 buckets (health probes: 500 ms interval, threshold 2).
[ejection_transition_s]
lo = 0
hi = 2

# Failed/503 responses OUTSIDE the eject-all fail-closed window (and outside a 2 s grace after
# each event). Single-instance ejection must not fail requests: peers absorb the load.
[ejection_stray_failed]
lo = 0
hi = 0
