# DocDag configuration for Plecto's Architecture Decision Records.
#
# Plecto's decision history is an append-only graph: a later ADR `amends` an earlier one to refine
# or correct it (the Decision body of the earlier ADR is never rewritten in place), and `supersedes`
# replaces it entirely. Both edge types are declared in frontmatter and both must stay acyclic.
#
# Identifiers are six digits (`docs/ADR/NNNNNN.md`), so `filename: "{id}.md"` makes `docdag new`
# write that bare-numeric name instead of the default `<id>-<kebab-title>.md`.
#
# `inverse: amended_by` states the reciprocity: an ADR declaring `amends: ["000052"]` obliges 000052
# to carry `amended_by: ["000NNN"]`, and a missing entry is an `inverse_mismatch` error. Adding such
# an entry is also the one frontmatter edit append-only history permits on a closed ADR, so
# `docdag validate --immutable-since <rev>` allows exactly that and rejects every other change.
#
# `references:` lifts body and frontmatter wikilinks into a validated layer: `[[000104]]` must name a
# real ADR. The `^(\d{6})$` pattern is deliberately narrow — manifest section pointers such as
# `[[tls]]`, `[[route]]` and `[[upstream]]` are TOML syntax, not references, and stay out of it.
#
# This file is the whole ADR gate. `scripts/check_adr_graph.py` is retired: `docdag validate` now
# covers what it used to (body wikilink resolution and `amended_by` reverse edges) on top of the
# frontmatter and typed-edge invariants it already enforced.

preset: adr
dir: docs/ADR
id_width: 6
status_field: status
status_values: [proposed, accepted, superseded]
filename: "{id}.md"

edges:
  - name: supersedes
    key: supersedes
    acyclic: true
    direction: forward
  - name: amends
    key: amends
    acyclic: true
    direction: forward
    inverse: amended_by

# A superseding ADR names its predecessor in frontmatter, so no status-string parsing is needed.
derived_edges: []

# `amends` and `supersedes` are one history, so a cycle that only their union closes is still a cycle.
acyclic_union: true

references:
  dangling: error
  pattern: '^(\d{6})$'
  scan: [body, frontmatter]

structural:
  missing_frontmatter: error

rules:
  - name: status_drift
    severity: error
    when:
      inbound: supersedes
      attr:
        status: { not: superseded }
    message: "has inbound supersedes but status is not superseded"
  - name: superseded_orphan
    severity: warn
    when:
      not_inbound: supersedes
      attr:
        status: { eq: superseded }
    message: "status is superseded but no document supersedes it"
