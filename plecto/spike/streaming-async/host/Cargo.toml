# SPIKE host (throwaway). wasmtime 50 (same pin as the production host) with component-model-async,
# driving the streaming guest. Its own [workspace] so the native plecto/ workspace is untouched.
[package]
name = "streaming-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "streaming-host"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "50.0.0", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime", "std"] }
wasmtime-wasi = "50.0.0"
tokio = { version = "1", features = ["macros", "rt"] }

[workspace]
